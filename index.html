<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NOANIME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#08080d;
    --card:#13131b;
    --card2:#1b1b25;
    --text:#ffffff;
    --muted:#92929f;
    --primary:#9c27ff;
    --primary2:#c43cff;
    --danger:#ff3b81;
    --border:#292934;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    min-height:100vh;
    padding-bottom:80px;
}

/* HEADER */

.header{
    padding:20px 16px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--primary2);
}

.header-button{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--card);
    color:white;
    font-size:20px;
}

/* SEARCH */

.search-container{
    padding:10px 16px;
}

.search{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px 16px;
    color:white;
    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:var(--primary);
}

/* HERO */

.hero{
    margin:12px 16px 24px;
    min-height:210px;
    border-radius:22px;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:
        linear-gradient(
            0deg,
            rgba(0,0,0,.95),
            rgba(0,0,0,.15)
        ),
        linear-gradient(
            135deg,
            #37105d,
            #15151e 55%,
            #08080d
        );
    overflow:hidden;
    position:relative;
}

.hero-badge{
    display:inline-block;
    background:var(--primary);
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    width:max-content;
    margin-bottom:10px;
}

.hero h1{
    font-size:27px;
    margin-bottom:6px;
}

.hero p{
    color:#c2c2ca;
    font-size:13px;
    line-height:1.5;
    max-width:310px;
}

.hero-button{
    margin-top:15px;
    width:max-content;
    background:white;
    color:black;
    padding:11px 18px;
    border-radius:12px;
    font-weight:bold;
}

/* SECTIONS */

.section{
    margin-bottom:28px;
}

.section-header{
    padding:0 16px 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section-title{
    font-size:20px;
    font-weight:800;
}

.section-more{
    color:var(--primary2);
    font-size:12px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 16px 5px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--border);
    color:#ddd;
    padding:11px 15px;
    border-radius:13px;
    font-size:13px;
}

.category.active{
    background:var(--primary);
    border-color:var(--primary);
    color:white;
}

/* MEDIA GRID */

.media-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 16px;
}

.media-card{
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    border:1px solid #20202a;
    position:relative;
}

.poster{
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
        linear-gradient(
            145deg,
            #33105c,
            #161620
        );
}

.poster.orange{
    background:linear-gradient(145deg,#7b3213,#201412);
}

.poster.blue{
    background:linear-gradient(145deg,#123b70,#111722);
}

.poster.red{
    background:linear-gradient(145deg,#711b31,#1b1016);
}

.poster.green{
    background:linear-gradient(145deg,#135d45,#101a18);
}

.poster.pink{
    background:linear-gradient(145deg,#71194e,#1b1018);
}

.poster-text{
    font-size:48px;
    font-weight:900;
    opacity:.8;
}

.type{
    position:absolute;
    top:9px;
    left:9px;
    background:rgba(0,0,0,.7);
    padding:5px 8px;
    border-radius:7px;
    font-size:9px;
    font-weight:bold;
}

.favorite{
    position:absolute;
    top:7px;
    right:7px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:17px;
}

.favorite.active{
    color:var(--danger);
}

.media-info{
    padding:11px;
}

.media-title{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.media-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

/* SEARCH RESULTS */

#searchPage{
    display:none;
}

.results{
    padding:0 16px;
}

.result{
    display:flex;
    gap:12px;
    padding:11px;
    margin-bottom:10px;
    background:var(--card);
    border-radius:15px;
    border:1px solid var(--border);
}

.result-poster{
    width:65px;
    height:85px;
    border-radius:10px;
    background:linear-gradient(145deg,#461278,#14141c);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:25px;
}

.result-info{
    flex:1;
}

.result-title{
    font-weight:bold;
    margin-bottom:5px;
}

.result-type{
    color:var(--primary2);
    font-size:11px;
}

.result-description{
    color:var(--muted);
    font-size:11px;
    margin-top:8px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:rgba(13,13,19,.96);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
    backdrop-filter:blur(12px);
}

.nav-item{
    background:none;
    color:#777783;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:10px;
}

.nav-icon{
    font-size:21px;
}

.nav-item.active{
    color:var(--primary2);
}

/* PAGE */

.page{
    display:none;
    padding:20px 16px;
}

.page.active{
    display:block;
}

.page-title{
    font-size:26px;
    font-weight:900;
    margin-bottom:20px;
}

/* DETAIL */

.detail{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
    overflow-y:auto;
}

.detail-cover{
    height:320px;
    background:linear-gradient(145deg,#45106e,#12121b);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.detail-letter{
    font-size:90px;
    font-weight:900;
    opacity:.7;
}

.close-detail
